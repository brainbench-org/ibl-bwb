# @package _global_
defaults:
  - override /model: ndt_stitch_10M
  - _self_

trainer:
  _target_: ts2.models.pretrained.ndt_stitch.NDTStitchEvalTrainer

precision: bf16
num_epochs: 300
base_lr: 1e-4
no_weight_decay: ["bias", "norm", "emb", "stitcher"]
finetuning:
  enable: true
  strategy:
    _target_: core.finetuning.FullFinetuning

val:
  start_patience: 50

ckpt:
  load_from: ${oc.env:BWB_PRETRAIN_CKPT_DIR}/ndt_stitch.pt

sweep:
  base_lr: [1e-4, 2e-4, 5e-4, 1e-3, 2e-3]

masker:
  _target_: pretrain.models.ndt_stitch.NDTStitchMasker
  mask_ratio: 0.5
  max_block_size: 7
  block_mask_prob: 0.5
