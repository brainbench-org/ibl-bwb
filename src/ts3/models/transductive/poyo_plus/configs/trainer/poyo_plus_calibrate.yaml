# @package _global_
defaults:
  - override /model: poyo_plus_10M
  - _self_

trainer:
  _target_: ts3.models.transductive.poyo_plus.POYOPlusCalibrateTrainer

# calibration is single-recording pretraining: same objective and task weights as
# poyo_plus_multitask_pretrain.yaml, restricted to one eval recording
recording_ids: ???  # single eval recording, e.g. [<EID>]

ckpt:
  load_from: ???  # the shared pretrain checkpoint, e.g. <ckpt.dir>/<run>/best.pt

precision: bf16
num_epochs: 100
batch_size: 32
base_lr: 1.4142e-4  # x sqrt(32) = 8e-4
weight_decay: 1e-4

finetuning:
  enable: true
  strategy:
    _target_: core.finetuning.GradualUnfreezing
    unfreeze_at_epoch: 40
    unfrozen_prefixes: [unit_emb., session_emb.]

num_workers: 4
persistent_workers: true
prefetch_factor: null

pct_start: 0.5
div_factor: 1.0

val:
  selection_key: avg_loss
  minimize: true
  every_n_epochs: 1
  patience: 50
  start_patience: 50

tasks:
  - choice
  - reward
  - stimulus_contrast
  - whisker_motion_energy
  - wheel_speed
  - right_paw_speed
  - left_paw_speed
  - licking_rate

multitask:
  task_loss_weights:
    choice: 0.01
    reward: 0.5
    stimulus_contrast: 0.1
    whisker_motion_energy: 1.0
    wheel_speed: 1.0
    right_paw_speed: 1.0
    left_paw_speed: 1.0
    licking_rate: 1.0

train_transforms:
  - _target_: torch_brain.transforms.UnitDropout
    max_units: 1800
    min_units: 300
    mode_units: 800
    peak: 4

wandb:
  project: ts3-poyo_plus_calibrate
