# @package _global_
defaults:
  - override /model: ndt_stitch_10M
  - _self_

trainer:
  _target_: pretrain.models.ndt_stitch.NDTStitchPretrain

precision: bf16
num_epochs: 200
batch_size: 16
base_lr: 1e-4
no_weight_decay: ["bias", "norm", "emb", "stitcher"]

val:
  minimize: true

ckpt:
  enable: true

masker:
  _target_: pretrain.models.ndt_stitch.NDTStitchMasker
  mask_ratio: 0.5
  max_block_size: 7
  block_mask_prob: 0.5

wandb:
  project: pretrain-ndt_stitch
