name: Ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          version: "0.15.9"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          version: "0.15.9"
